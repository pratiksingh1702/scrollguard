name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Flavor to build (play or direct)'
        required: true
        default: 'play'
        type: choice
        options:
          - play
          - direct
      track:
        description: 'Google Play track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - beta
          - production
      rollout_percentage:
        description: 'Staged rollout percentage (for production)'
        required: false
        default: '5'

jobs:
  build-and-release:
    name: Build Signed Bundle & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get

      - name: Verify Code Quality & Tests
        run: |
          flutter analyze
          flutter test --coverage
          cd android && ./gradlew testPlayDebugUnitTest && cd ..

      - name: Setup Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "$KEY_PROPERTIES" > android/key.properties
          fi

      - name: Build Signed Android App Bundle (AAB with R8 & Dart Obfuscation)
        if: ${{ github.event.inputs.flavor != 'direct' }}
        run: |
          flutter build appbundle \
            --flavor play \
            --target lib/main.dart \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Build Sideload APK (Direct Flavor)
        if: ${{ github.event.inputs.flavor == 'direct' }}
        run: |
          flutter build apk \
            --flavor direct \
            --target lib/main.dart \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Upload Debug Symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          npx @sentry/cli releases files scrollguard@${{ github.ref_name }} upload-sourcemaps build/app/outputs/symbols

      - name: Deploy to Google Play Console
        if: ${{ github.event.inputs.flavor != 'direct' && env.PLAY_STORE_JSON_KEY != '' }}
        uses: r0adkll/upload-google-play@v1
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.yourorg.scrollguard.play
          releaseFiles: build/app/outputs/bundle/playRelease/app-play-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          userFraction: ${{ (github.event.inputs.track == 'production') && (github.event.inputs.rollout_percentage / 100) || 1.0 }}
          mappingFile: build/app/outputs/mapping/playRelease/mapping.txt
